name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::Run gofmt on: $unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go test ./...
      - name: Official plugins, against this checkout of the SDK
        run: |
          set -euo pipefail
          go work init . plugins/*/
          for d in plugins/*/; do
            (cd "$d" && go vet ./... && go test ./...)
            go run ./cmd/girvi plugin build "$d"
          done
